const ON="zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen".split(" "),TN="_ _ twenty thirty forty fifty sixty seventy eighty ninety".split(" ");
function n2w(n){if(n<20)return ON[n];if(n<100)return TN[n/10|0]+(n%10?" "+ON[n%10]:"");if(n<1000)return ON[n/100|0]+" hundred"+(n%100?" "+n2w(n%100):"");return String(n)}
function norm(s){return s.toLowerCase().replace(/(\d+)\.(\d+)/g,"$1 point $2").replace(/%/g," percent").replace(/(\d+)/g,m=>n2w(+m)).replace(/[^\p{L}\p{M}\p{N}\s]/gu,"").replace(/\s+/g," ").trim()}
function sim(a,b){if(a===b)return 1;if(!a||!b)return 0;const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[m][n]/Math.max(m,n)}

function start(li,si){
const lv=LV()[li];R={li,si,i:0,score:0,ci:0,lock:false,sp:[]};

else if(si===1){R.cards=lv.s.map(s=>({big:"💬",t:s,sub:"",say:s}));R.qs=lv.s.map(s=>({t:"b",s}))}
else{R.cards=null;R.qs=lv.q.map(q=>({t:"m",p:q[0],e:"❓",a:q[1][q[2]],say:q[0],o:shuf(q[1])}))}
R.cards?card():ask()}
const topBtn=()=>`<button onclick="map()" class="mb-3 bg-white rounded-full px-4 py-2 font-bold shadow flex items-center gap-1">${ic("arrow-left","w-4 h-4")} Back · వెనక్కి</button>`;

function listen(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,m=document.getElementById("sp");
if(!SR){skip(MSG.skip);return}

r.onresult=e=>{const good=[...e.results[0]].some(a=>sim(norm(a.transcript),t)>=TH);if(good){R.sp[R.ci]=true;confetti();card()}else m.textContent=MSG.retry};
r.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture","network","language-not-supported"].includes(e.error))skip(MSG.skip);else m.textContent=MSG.retry};
r.start()}catch(e){skip(MSG.skip)}}
function skip(msg){const m=document.getElementById("sp"),c=R.ci;if(m)m.textContent=msg;setTimeout(()=>{if(R.ci===c&&!R.sp[c]){R.sp[c]=true;confetti();card()}},900)}
function nextCard(){if(!R.sp[R.ci])return;if(R.ci<R.cards.length-1){R.ci++;card();say(R.cards[R.ci].say)}else ask()}

function ask(){
R.lock=false;const q=R.qs[R.i],n=R.qs.length;

<div id="fb" class="mt-4 text-2xl font-extrabold min-h-[40px]"></div></div>`);

<div id="slot" class="min-h-[64px] bg-yellow-50 border-4 border-dashed border-yellow-300 rounded-2xl p-2 flex flex-wrap gap-2 justify-center items-center mb-3"></div>

<div id="fb" class="mt-3 text-2xl font-extrabold min-h-[40px]"></div></div>`);

function chips(){
document.getElementById("slot").innerHTML=R.used.map(i=>`<span class="bg-green-200 rounded-xl px-3 py-2 font-extrabold text-lg">${esc(R.sh[i])}</span>`).join("")||'<span class="text-gray-400 font-bold">Tap the words · పదాలను నొక్కండి</span>';
document.getElementById("chips").innerHTML=R.sh.map((w,i)=>R.used.includes(i)?"":`<button onclick="chip(${i})" class="bg-indigo-100 text-indigo-800 rounded-xl px-4 py-3 text-xl font-extrabold shadow">${esc(w)}</button>`).join("")}
function undo(){if(R.lock)return;R.used.pop();chips()}
function chip(i){
if(R.lock)return;R.used.push(i);chips();
if(R.used.length===R.words.length){const ans=R.used.map(k=>R.sh[k]).join(" ");reply(ans===R.qs[R.i].s,"Correct: "+R.qs[R.i].s,R.qs[R.i].s)}}
function pick(i){
if(R.lock)return;const q=R.qs[R.i],ok=q.o[i]===q.a;
document.getElementById("o"+i).className+=ok?" !bg-green-400 !text-white":" !bg-red-300 shake";
if(!ok)q.o.forEach((o,k)=>{if(o===q.a)document.getElementById("o"+k).className+=" !bg-green-400 !text-white"});
reply(ok,"Correct answer · సరైన జవాబు: "+q.a,R.si===0?q.a:null)}
function reply(ok,wrongMsg,speak){
R.lock=true;if(ok)R.score++;
const fb=document.getElementById("fb"),last=R.i===R.qs.length-1;
fb.innerHTML=`<div class="${ok?"text-green-600":"text-orange-600"} pop">${ok?pick1(GOOD):pick1(BAD)}</div>${ok?"":`<div class="text-base text-gray-700">${esc(wrongMsg)}</div>`}
<button onclick="R.i++;${last?"finish()":"ask()"}" class="mt-3 bg-green-500 text-white rounded-2xl px-8 py-3 font-extrabold shadow">${last?"Result · ఫలితం 🏁":"Next ▶ తరువాత"}</button>`;
if(ok)confetti();if(speak)say(speak)}

function finish(){
const n=R.qs.length,pct=Math.round(R.score/n*100),pass=pct>=80,stars=R.score===n?3:pass?2:0,g=R.li*3+R.si;
